<!DOCTYPE html>
<html>
<head><title>Enemy Sprite Test</title></head>
<body style="background:#000">
<canvas id="c" width="640" height="900"></canvas>
<div id="info" style="color:#fff;font-family:monospace"></div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const EGA_RGB = [
  [0x00,0x00,0x00], [0x00,0x00,0xAA], [0x00,0xAA,0x00], [0x00,0xAA,0xAA],
  [0xAA,0x00,0x00], [0xAA,0x00,0xAA], [0xAA,0x55,0x00], [0xAA,0xAA,0xAA],
  [0x55,0x55,0x55], [0x55,0x55,0xFF], [0x55,0xFF,0x55], [0x55,0xFF,0xFF],
  [0xFF,0x55,0x55], [0xFF,0x55,0xFF], [0xFF,0xFF,0x55], [0xFF,0xFF,0xFF],
];

function rgbToEGA(r, g, b) {
  let best = 0, bestDist = Infinity;
  for (let i = 0; i < 16; i++) {
    const dr = r - EGA_RGB[i][0], dg = g - EGA_RGB[i][1], db = b - EGA_RGB[i][2];
    const d = dr*dr + dg*dg + db*db;
    if (d < bestDist) { bestDist = d; best = i; }
  }
  return best;
}

const typeNames = ['Spider', 'Viper', 'Snail', 'Turtle'];
const orientNames = ['Right', 'Left', 'Down', 'Up'];

async function test() {
  const es = await fetch('assets/enemies.json').then(r => r.json());
  const info = document.getElementById('info');

  const B_SAncho = 10, B_SAlto = 10;
  const bgColors = [3, 0]; // CYAN and BLACK backgrounds
  const scale = 3;

  let yOff = 10;

  for (const bgc of bgColors) {
    const bgRGB = EGA_RGB[bgc];
    ctx.fillStyle = '#fff';
    ctx.font = '12px monospace';
    ctx.fillText(`Background: ${bgc === 3 ? 'CYAN' : 'BLACK'}`, 10, yOff);
    yOff += 5;

    for (let tipo = 1; tipo <= 4; tipo++) {
      // Label
      ctx.fillStyle = '#fff';
      ctx.font = '10px monospace';
      ctx.fillText(typeNames[tipo - 1], 10, yOff + 12);

      let xOff = 80;
      for (let orient = 0; orient < 4; orient++) {
        for (let frame = 0; frame < 3; frame++) {
          const colorIdx = frame + 0*3 + orient*6 + (tipo-1)*24;
          const maskIdx  = frame + 1*3 + orient*6 + (tipo-1)*24;
          const colorSprite = es.sprites[colorIdx];
          const maskSprite  = es.sprites[maskIdx];

          if (!colorSprite || !maskSprite) { xOff += scale * 20 + 5; continue; }

          const w = colorSprite.w, h = colorSprite.h;

          // Draw background rect
          ctx.fillStyle = `rgb(${bgRGB[0]},${bgRGB[1]},${bgRGB[2]})`;
          ctx.fillRect(xOff, yOff, w * scale, h * scale);

          // Draw sprite with AND/OR masking
          for (let py = 0; py < h; py++) {
            for (let px = 0; px < w; px++) {
              const p = py * w + px;
              const spriteColor = colorSprite.pixels[p] & 0x0F;
              const maskVal = maskSprite.pixels[p] & 0x0F;
              const finalColor = (bgc & maskVal) | spriteColor;
              const fc = EGA_RGB[finalColor];
              ctx.fillStyle = `rgb(${fc[0]},${fc[1]},${fc[2]})`;
              ctx.fillRect(xOff + px * scale, yOff + py * scale, scale, scale);
            }
          }

          xOff += w * scale + 3;
        }
        // Gap between orientations
        xOff += 8;
      }
      yOff += 22 * scale + 5;
    }
    yOff += 15;
  }

  info.textContent = `Enemy sprites: ${es.sprites.length} total. Each row: 4 orientations × 3 frames. Shown on CYAN and BLACK backgrounds.`;
}
test();
</script>
</body>
</html>
